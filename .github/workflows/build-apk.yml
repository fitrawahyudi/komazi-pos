name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (contoh: v1.0.1). Kosongkan untuk build latest otomatis.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Komazi POS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Assets (React + Vite)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://komazi-pos-production.up.railway.app/api

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android APK (Debug / Self-Signed)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset & Compute Checksum
        id: prep
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/komazi-pos.apk
          SHA256=$(sha256sum dist-apk/komazi-pos.apk | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Built APK with SHA256: $SHA256"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: komazi-pos-apk
          path: dist-apk/komazi-pos.apk
          retention-days: 90

      - name: Determine Release Tag
        id: tag_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "name=Komazi POS Android ${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "name=Komazi POS Android $TAG_NAME" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && ([[ "${{ github.ref }}" == refs/heads/main ]] || [[ "${{ github.ref }}" == refs/heads/master ]]); then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "name=Komazi POS Android (Latest Auto-Build)" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      # Solusi 1: Publish ke Internal / Private GitHub Releases
      - name: Publish to Private GitHub Releases
        if: steps.tag_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_check.outputs.tag }}
          name: ${{ steps.tag_check.outputs.name }}
          draft: false
          prerelease: false
          files: dist-apk/komazi-pos.apk
          body: |
            ### 📱 Komazi POS Android Release (${{ steps.tag_check.outputs.tag }})
            
            Aplikasi tablet kasir Komazi POS (Coffee & Resto).
            
            - **Nama Berkas:** `komazi-pos.apk`
            - **Package:** `com.komazipos`
            - **Minimum Android:** Android 7.0+ (API 24+)
            - **SHA-256 Checksum:** `${{ steps.prep.outputs.sha256 }}`
            - **Commit SHA:** `${{ github.sha }}`
            
            #### 🛠 Cara Instalasi di Tablet:
            1. Unduh berkas `komazi-pos.apk`.
            2. Buka berkas dan aktifkan *"Izinkan dari sumber ini"* (Unknown Sources).
            3. Beri izin Bluetooth untuk menghubungkan printer thermal kasir ESC/POS.

      # Solusi 2: Publish ke Public Releases Repo (Tanpa Source Code) jika RELEASE_PAT dikonfigurasi
      - name: Publish to Public Distribution Repo (Zero Source Code Leak)
        if: steps.tag_check.outputs.should_release == 'true' && env.HAS_RELEASE_PAT == 'true'
        uses: softprops/action-gh-release@v2
        env:
          HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' }}
        with:
          repository: ${{ secrets.PUBLIC_RELEASE_REPO || 'fitrawahyudi/komazi-pos-releases' }}
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ steps.tag_check.outputs.tag }}
          name: ${{ steps.tag_check.outputs.name }}
          draft: false
          prerelease: false
          files: dist-apk/komazi-pos.apk
          body: |
            ### 📱 Komazi POS Android Public Release (${{ steps.tag_check.outputs.tag }})
            
            Distribusi resmi berkas APK tablet Komazi POS (Aplikasi Kasir Coffee Shop & Workspace).
            
            - **Nama Berkas:** `komazi-pos.apk`
            - **SHA-256 Checksum:** `${{ steps.prep.outputs.sha256 }}`
            - **Target:** Android 7.0+ (Nougat s/d 15)
            - **Waktu Rilis:** ${{ steps.tag_check.outputs.name }}
            
            > Berkas ini didistribusikan secara aman tanpa menyertakan kode sumber internal.

